# Настройки камеры «Косынки».
# Файл необязательный: если его нет, игра берёт значения по умолчанию (те, что
# закомментированы ниже). Файл ищется сначала в текущем каталоге, затем рядом
# с исполняемым файлом.
#
# Формат:  ключ = значение
# Комментарии: всё после '#' или ';' до конца строки игнорируется.
# Векторы записываются как "x, y, z".

# --- Положение камеры в мировых координатах ---
# camera.position = 0, 32, 26

# --- Точка, на которую смотрит камера ---
# camera.target = 0, 0, 0

# --- Направление "вверх" (не должен быть нулевым) ---
# camera.up = 0, 1, 0

# --- Размер кадра ---
# Проекция по умолчанию ортографическая (ortho), поэтому fovy здесь — НЕ углы,
# а ВЫСОТА видимой области в мировых единицах. Чем больше число, тем дальше
# «отодвинута» камера и тем больше карт влезает в окно (поля по краям растут).
# На маленьком экране или в узком окне карты жмутся к краям — увеличьте fovy.
#   было 12.48 (по умолчанию); 14-15 — заметно просторнее, 11 — крупнее.
# camera.fovy = 12.48

# --- Тип проекции: ortho (ортографическая) или persp (перспективная) ---
# camera.projection = ortho
